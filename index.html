<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#183d24" />
  <title>Безумные ягодки: Лесное королевство</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="assets/map-digits.css" />
  <script>window.berriesDigitsReady=document.fonts.load('700 32px BerriesDigits','0123456789').catch(()=>[]);</script>
  <!-- На Яндекс Играх /sdk.js доступен платформой. В standalone может вернуть 404 — игра продолжит работу. -->
  <script src="/sdk.js"></script>
  <script src="vendor/phaser.min.js"></script>
</head>
<body>
  <main id="game-shell" aria-label="Безумные ягодки">
    <div id="game"></div>
    <div id="rotate-hint" role="status">Поверните устройство горизонтально 🌿</div>
  </main>
  <script src="src/lifecycle.js"></script>
  <script src="src/sdk/yandex.js?v=mvp-20260928-daily4"></script>
  <script src="src/campaign.js?v=mvp-20260928-daily4"></script>
<script src="src/vertical_slice.js?v=mvp-20260928-daily4"></script>
<script src="src/runtime_stable_v10.js?v=mvp-20260928-daily4"></script>
<script>
const field=document.getElementById('game-shell');
for(const event of ['contextmenu','dragstart','selectstart'])field.addEventListener(event,e=>e.preventDefault());

// Keep Phaser fitted to the live host size, but never hide an already-rendered game.
(() => {
  const shell=document.getElementById('game-shell');
  const refresh=()=>{try{window.__berriesGame?.scale?.refresh?.()}catch{}};
  const burst=()=>{
    requestAnimationFrame(refresh);
    setTimeout(refresh,60);
    setTimeout(refresh,180);
    setTimeout(refresh,450);
  };
  if(window.ResizeObserver){
    const observer=new ResizeObserver(burst);
    observer.observe(shell);
  }
  window.addEventListener('resize',burst,{passive:true});
  window.addEventListener('orientationchange',burst,{passive:true});
  burst();
})();
</script>
</body>
</html>
