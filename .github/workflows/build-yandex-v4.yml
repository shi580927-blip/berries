name: Build Yandex v4

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-yandex-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run core regression tests
        run: |
          node tests/campaign.cjs
          node tests/special-label-lifecycle.cjs

      - name: Assemble production folder
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/src/sdk release/audio
          cp index.html styles.css release/
          cp -R assets release/assets
          cp -R vendor release/vendor
          rsync -a --exclude='*_old*' audio/ release/audio/
          cp src/lifecycle.js release/src/lifecycle.js
          cp src/campaign.js release/src/campaign.js
          cp src/vertical_slice.js release/src/vertical_slice.js
          cp src/runtime_stable_v10.js release/src/runtime_stable_v10.js
          cp src/sdk/yandex.js release/src/sdk/yandex.js

      - name: Prepare release-only credits
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('release/src').rglob('*.js'):
              s=p.read_text(encoding='utf-8')
              s=s.replace('Музыка: Kevin MacLeod (incompetech.com)', 'Музыка: Kevin MacLeod')
              s=s.replace('https://creativecommons.org/licenses/by/4.0/', 'Creative Commons Attribution 4.0 International')
              p.write_text(s,encoding='utf-8')
          PY

      - name: Validate release tree and runtime assets
        run: |
          set -euo pipefail
          test -f release/index.html
          test -f release/vendor/phaser.min.js
          test -f release/src/sdk/yandex.js
          test -f release/src/campaign.js
          test -f release/src/vertical_slice.js
          test -f release/src/runtime_stable_v10.js
          test ! -f release/screenshots.html
          ! find release -type f -printf '%P\n' | grep -P '[А-Яа-яЁё ]'
          ! grep -R -nE 'https?://|incompetech\.com' release/src release/index.html || (echo 'External URL remains in user-facing runtime' && exit 1)
          python - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path('release')
          files=[root/'src/vertical_slice.js',root/'src/runtime_stable_v10.js',root/'index.html']
          exts=r'(?:png|jpg|jpeg|webp|mp3|ogg|wav|woff2|js|css)'
          refs=set()
          for p in files:
              text=p.read_text(encoding='utf-8')
              refs.update(re.findall(r"['\"]((?:assets|audio|vendor)/[^'\"?]+\."+exts+r")(?:\?[^'\"]*)?['\"]",text,re.I))
          missing=sorted(r for r in refs if not (root/r).is_file())
          if missing:
              print('Missing literal runtime assets:')
              print('\n'.join(missing))
              sys.exit(1)
          print(f'Validated {len(refs)} literal runtime asset paths')
          PY
          BYTES=$(du -sb release | cut -f1)
          echo "Unpacked release bytes: $BYTES"
          test "$BYTES" -le 100000000

      - name: Build Yandex ZIP
        run: |
          set -euo pipefail
          cd release
          zip -9 -r ../berries_yandex_v4.zip . >/dev/null
          cd ..
          test "$(unzip -Z1 berries_yandex_v4.zip | grep -c '^index.html$')" -eq 1
          echo "ZIP bytes: $(stat -c%s berries_yandex_v4.zip)"
          echo "Top of archive:"
          unzip -Z1 berries_yandex_v4.zip | head -30

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: berries-yandex-v4
          path: berries_yandex_v4.zip
          if-no-files-found: error
          retention-days: 30
