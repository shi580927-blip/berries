name: Build Yandex v3

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-yandex-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run release tests
        run: |
          node tests/campaign.cjs
          node tests/special-label-lifecycle.cjs
          node tests/release.cjs

      - name: Assemble production folder
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/src/sdk
          cp index.html styles.css release/
          cp -R assets release/assets
          cp -R audio release/audio
          cp -R vendor release/vendor
          cp src/lifecycle.js release/src/lifecycle.js
          cp src/campaign.js release/src/campaign.js
          cp src/vertical_slice.js release/src/vertical_slice.js
          cp src/runtime_stable_v10.js release/src/runtime_stable_v10.js
          cp src/sdk/yandex.js release/src/sdk/yandex.js

      - name: Strip external URLs from in-game credits
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('release').rglob('*.js'):
              s=p.read_text(encoding='utf-8')
              s=s.replace('Музыка: Kevin MacLeod (incompetech.com)', 'Музыка: Kevin MacLeod')
              s=s.replace('https://creativecommons.org/licenses/by/4.0/', 'Creative Commons Attribution 4.0 International')
              p.write_text(s,encoding='utf-8')
          PY

      - name: Validate release tree
        run: |
          set -euo pipefail
          test -f release/index.html
          test -f release/vendor/phaser.min.js
          test -f release/src/sdk/yandex.js
          test -f release/src/campaign.js
          test -f release/src/vertical_slice.js
          test -f release/src/runtime_stable_v10.js
          ! find release -type f -printf '%P\n' | grep -P '[А-Яа-яЁё ]'
          ! grep -R -nE 'https?://|incompetech\.com' release --include='*.js' --include='*.html' || (echo 'External URL remains in runtime' && exit 1)
          BYTES=$(du -sb release | cut -f1)
          echo "Unpacked release bytes: $BYTES"
          test "$BYTES" -le 100000000

      - name: Build Yandex ZIP
        run: |
          cd release
          zip -9 -r ../berries_yandex_v3.zip .
          cd ..
          unzip -l berries_yandex_v3.zip | head -40
          test "$(unzip -Z1 berries_yandex_v3.zip | grep -c '^index.html$')" -eq 1
          echo "ZIP bytes: $(stat -c%s berries_yandex_v3.zip)"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: berries-yandex-v3
          path: berries_yandex_v3.zip
          if-no-files-found: error
          retention-days: 30
